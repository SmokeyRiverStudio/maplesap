name: Publish Casual Misconduct Seed 01

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      META_GRAPH_VERSION: v24.0
      SEED_NUMBER: "1"
      VIDEO_PATH: facebook-assets/casual-misconduct-seeds/seed-01.mp4
      DESTINATIONS: facebook,instagram
    steps:
      - name: Check out approved Seed 01 asset
        uses: actions/checkout@v4

      - name: Install publisher dependencies
        run: python -m pip install requests

      - name: Publish approved Seed 01 Reel
        run: python scripts/publish_casual_misconduct_seed.py
