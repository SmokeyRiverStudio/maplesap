name: Publish Casual Misconduct Seed 02 Facebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      META_GRAPH_VERSION: v24.0
      SEED_NUMBER: "2"
      VIDEO_PATH: facebook-assets/casual-misconduct-seeds/seed-02.mp4
      DESTINATIONS: facebook
    steps:
      - name: Check out approved Seed 02 asset
        uses: actions/checkout@v4

      - name: Install publisher dependencies
        run: python -m pip install requests

      - name: Publish approved Seed 02 Reel to Facebook only
        run: python scripts/publish_casual_misconduct_seed.py
